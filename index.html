<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回声 · 游戏部</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d1a'/%3E%3Ccircle cx='11' cy='16' r='4.2' fill='%23ff6d9a'/%3E%3Ccircle cx='21' cy='16' r='4.2' fill='%2366ccff'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0b0d1a;color:#eee;font-family:ui-sans-serif,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:12px;top:8px;font-size:16px;pointer-events:none;text-shadow:0 1px 2px #000}
  #dock{position:fixed;left:0;right:0;bottom:22px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  #dock button{pointer-events:auto;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:0;padding:8px 16px;font:15px ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;cursor:pointer}
  #dock button:hover{border-color:#fff}
  #dock button.quiet{border:none;letter-spacing:0;padding:0;color:rgba(255,255,255,.72)}
  #netmsg{pointer-events:none;font-size:14px;color:rgba(255,255,255,.88);text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="ui"></div>
<div id="dock">
  <div id="netmsg"></div>
  <button id="campaign" type="button">闯关</button>
  <button id="quests" type="button">任务</button>
  <button id="multi" type="button">多人同场</button>
  <button id="leave" type="button" class="quiet" hidden>退出多人</button>
</div>
<canvas id="c"></canvas>
<script src="shared.js"></script>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
const ui = document.getElementById('ui');
const STEPS = 360;
const CAP_W = 960;
const CAP_H = 540;

let LW = CAP_W, LH = CAP_H;
let view = {s: 1, dpr: 1, ox: 0, oy: 0};
let AC;
let best = 0;
try { best = +(localStorage.echoBest || 0) || 0; } catch (e) {}

let state = 'menu';
let p = null;
let vx = 0, vy = 0;
let ghosts = [];
let rec = [];
let t = 0;
let round = 1;
let score = 0;
let stars = [];
let parts = [];
let keys = {};
let mouse = null;
let shake = 0;
let banner = 0;
const Rules = window.EchoRules;
let roleId = 'echo';
try {
  const savedRole = localStorage.echoRole;
  if (Rules.roleById(savedRole)) roleId = savedRole;
} catch (e) {}
const sheets = {};
const faceRows = {};
function loadSheets() {
  Rules.CAST.forEach(role => {
    if (!role.sheet || sheets[role.id]) return;
    const img = new Image();
    img.src = role.sheet;
    sheets[role.id] = img;
  });
}
loadSheets();
let gear = Rules.emptyGear();
let hp = 1;
let maxHp = 1;
let shield = 0;
let iframes = 0;
let dashLeft = 0;
let dashCd = 0;
let dashX = 1;
let dashY = 0;
let shopLeft = 0;
let shopReady = false;
let shopHits = [];
let endHits = [];
let endPrompt = '';
let gearMsg = '';
let gearMsgT = 0;
let soloSeed = 1;
let starSeq = 1;
let spentStars = new Set();
let checkpoint = null;
let resetHold = false;
let playHits = [];
let campaignOn = false;
let stageId = 1;
let stageDamage = 0;
let monsters = [];
let shots = [];
let drops = [];
let walls = [];
let echoHoles = [];
let soloDashHits = {};
let profile = null;
let board = '';
let boardHits = [];
let castHits = [];
let questOpen = false;
let deathCause = '';
let dashMul = 1;
let stageLabel = '';
let NET = {
  active: false,
  connecting: false,
  grace: false,
  state: 'menu',
  step: 0,
  id: null,
  color: null,
  snap: null,
  epoch: -1,
  deathText: '',
  roundDeaths: [],
  graceUntil: 0,
  savedBest: false,
  ws: null,
  intentionalClose: false,
};
const echoLayer = document.createElement('canvas');
const ex = echoLayer.getContext('2d');

function unit() { return Math.min(LW, LH); }
function moveSpeed() {
  const mul = state === 'play' || state === 'shop' ? Rules.statsOf(gear).speed : 1;
  return unit() * 0.44 * mul;
}
function bodyR() { return unit() * 0.02; }
function collectR() { return unit() * 0.04; }
function collideDist() {
  return bodyR() * 2 + unit() * 0.00115 * Math.min(ghosts.length, 10);
}
function todayKey() { return new Date().toISOString().slice(0, 10); }
function starGoal() {
  if (!campaignOn) return Math.min(4, 2 + Math.floor((round - 1) / 2));
  return Rules.starGoal(round, Rules.stageById(stageId));
}

function chooseArena() {
  const fit = Math.min(innerWidth / CAP_W, innerHeight / CAP_H);
  if (fit >= 1) { LW = CAP_W; LH = CAP_H; }
  else { LW = Math.max(320, innerWidth); LH = Math.max(240, innerHeight); }
}

function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / LW, innerHeight / LH);
  view = {
    s,
    dpr,
    ox: (innerWidth - LW * s) / 2,
    oy: (innerHeight - LH * s) / 2,
  };
  c.width = Math.max(1, Math.round(innerWidth * dpr));
  c.height = Math.max(1, Math.round(innerHeight * dpr));
}

function toLogical(cx, cy) {
  return {
    x: Math.max(0, Math.min(LW, (cx - view.ox) / view.s)),
    y: Math.max(0, Math.min(LH, (cy - view.oy) / view.s)),
  };
}

function beep(f, d = 0.1, type = 'sine', v = 0.15) {
  try {
    AC = AC || new AudioContext();
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type;
    o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.connect(g).connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + d);
  } catch (e) {}
}

function boom(X, Y, col, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * unit() * 0.012;
    parts.push({x: X, y: Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 28, col});
  }
}

function starValid(sx, sy) {
  const u = unit();
  if (Math.hypot(sx - p.x, sy - p.y) < u * 0.12) return false;
  for (const s of stars) if (Math.hypot(s.x - sx, s.y - sy) < u * 0.1) return false;
  for (const g of ghosts) {
    const q = g[Math.min(t, g.length - 1)];
    if (q && Math.hypot(q.x - sx, q.y - sy) < collideDist() + u * 0.02) return false;
  }
  return true;
}

function spawnStar() {
  const u = unit();
  const maxD = Math.min(Math.hypot(LW, LH), u * (0.34 + (round - 1) * 0.13));
  const minD = u * 0.14;
  for (let n = 0; n < 28; n++) {
    let sx, sy;
    if (n < 22) {
      const a = Math.random() * Math.PI * 2;
      const d = minD + Math.random() * Math.max(8, maxD - minD);
      sx = p.x + Math.cos(a) * d;
      sy = p.y + Math.sin(a) * d;
    } else {
      sx = u * 0.06 + Math.random() * (LW - u * 0.12);
      sy = u * 0.06 + Math.random() * (LH - u * 0.12);
    }
    sx = Math.max(u * 0.05, Math.min(LW - u * 0.05, sx));
    sy = Math.max(u * 0.05, Math.min(LH - u * 0.05, sy));
    if (!starValid(sx, sy)) continue;
    stars.push({ id: starSeq++, x: sx, y: sy });
    return;
  }
}

function clearHeldInput() {
  Object.keys(keys).forEach((key) => { keys[key] = 0; });
  mouse = null;
  vx = 0;
  vy = 0;
  dashLeft = 0;
  dashCd = 0;
}

function placeAtSeat(slot) {
  const at = Rules.seatSpawn(slot || 0, LW, LH);
  p = { x: at.x, y: at.y };
  vx = 0;
  vy = 0;
}

function reset() {
  chooseArena();
  layout();
  clearHeldInput();
  placeAtSeat(0);
  ghosts = [];
  rec = [];
  t = 0;
  round = 1;
  score = 0;
  stars = [];
  parts = [];
  shake = 0;
  banner = 0;
  gear = Rules.emptyGear();
  const seedQuery = new URLSearchParams(location.search).get('seed');
  soloSeed = seedQuery != null && seedQuery !== '' ? (Number(seedQuery) >>> 0) : ((Math.random() * 0x100000000) >>> 0);
  hp = 1;
  maxHp = 1;
  shield = 0;
  iframes = 0;
  dashLeft = 0;
  dashCd = 0;
  shopLeft = 0;
  shopReady = false;
  gearMsg = '';
  gearMsgT = 0;
  campaignOn = false;
  questOpen = false;
  board = '';
  deathCause = '';
  stageLabel = '';
  monsters = [];
  shots = [];
  drops = [];
  walls = [];
  echoHoles = [];
  spawnStar();
  spawnStar();
  spentStars = new Set();
  resetHold = false;
  takeCheckpoint();
  state = 'play';
  beep(523, 0.08, 'triangle', 0.12);
}

function returnToMenu() {
  if (NET.active || NET.connecting) return;
  chooseArena();
  layout();
  state = 'menu';
  campaignOn = false;
  board = '';
  deathCause = '';
  gearMsg = '';
  gearMsgT = 0;
  p = null;
  vx = 0;
  vy = 0;
  ghosts = [];
  rec = [];
  stars = [];
  monsters = [];
  shots = [];
  drops = [];
  walls = [];
  echoHoles = [];
  parts = [];
  banner = 0;
  shopLeft = 0;
  shopReady = false;
  round = 1;
  t = 0;
  score = 0;
  endHits = [];
  endPrompt = '';
  syncMenuButtons();
}

function die(cause) {
  deathCause = cause || '';
  state = 'over';
  shake = unit() * 0.02;
  boom(p.x, p.y, '#f55', 48);
  beep(110, 0.5, 'sawtooth', 0.25);
  if (score > best) {
    best = score;
    try { localStorage.echoBest = String(best); } catch (e) {}
  }
}

function finishRound() {
  ghosts.push(rec);
  echoHoles.push({});
  rec = [];
  const stats = liveStats();
  const gain = stats.reward || 1;
  score += Math.round(Rules.SCORE_ROUND * stats.score * gain);
  gear.t += Math.round(Rules.T_ROUND * gain);
  Rules.noteSamples(gear);
  Rules.openStock(gear, soloSeed, round, 'solo');
  stars = [];
  if (campaignOn) {
    loadProfile();
    const up = Rules.addXp(profile, 2);
    gear.t += up.bonus;
    noteLevels(up.levels);
    const stage = Rules.stageById(stageId);
    const king = monsters.some(mon => mon.kind === 'king' && mon.hp > 0);
    saveProfile();
    if (stage && round >= stage.rounds && stage.boss && king) {
      die('回声王还在');
      return;
    }
  }
  state = 'shop';
  shopLeft = Rules.SHOP_STEPS;
  shopReady = false;
  banner = 70;
  iframes = 0;
  dashLeft = 0;
  if (campaignOn) syncCampaignHearts(true);
  else {
    maxHp = stats.maxHp;
    hp = maxHp;
    shield = stats.blocks;
  }
  beep(330, 0.15, 'triangle', 0.16);
  setTimeout(() => beep(495, 0.2, 'triangle', 0.16), 120);
  if (p) boom(p.x, p.y, '#6cf', 24);
  shake = unit() * 0.008;
}

function clearCampaignStage() {
  const stage = Rules.stageById(stageId);
  loadProfile();
  if (stage && profile.unlocked < stage.id + 1) profile.unlocked = Math.min(Rules.STAGES.length, stage.id + 1);
  const today = todayKey();
  if (stage) Rules.bumpQuest(profile, 'clear', 1, { stage: stage.id }, today);
  if (!stageDamage) Rules.bumpQuest(profile, 'flawless', 1, null, today);
  saveProfile();
  monsters = [];
  shots = [];
  drops = [];
  state = 'clear';
  board = '';
  noteGear(stage ? ('打通了 ' + stage.name) : '过关');
}

function endShop() {
  if (campaignOn) {
    const stage = Rules.stageById(stageId);
    if (stage && round >= stage.rounds) {
      clearCampaignStage();
      beep(523, 0.16, 'triangle', 0.16);
      return;
    }
  }
  shopReady = false;
  round += 1;
  t = 0;
  rec = [];
  stars = [];
  state = 'play';
  banner = 70;
  clearHeldInput();
  placeAtSeat(0);
  const stats = Rules.statsOf(gear);
  if (campaignOn) {
    monsters = Rules.spawnWave(Rules.stageById(stageId), round, soloSeed, monsters);
    shots = [];
    syncCampaignHearts(true);
  } else {
    maxHp = stats.maxHp;
    hp = maxHp;
    shield = stats.blocks;
  }
  iframes = 0;
  dashLeft = 0;
  dashCd = 0;
  let guard = 0;
  while (stars.length < starGoal() && guard++ < 4) spawnStar();
  spentStars = new Set();
  resetHold = false;
  takeCheckpoint();
  if (campaignOn) saveProfile();
  beep(330, 0.15, 'triangle', 0.16);
  setTimeout(() => beep(495, 0.2, 'triangle', 0.16), 120);
}

function facing() {
  let ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (ix || iy) {
    const l = Math.hypot(ix, iy);
    return { x: ix / l, y: iy / l };
  }
  if (mouse && p) {
    const l = Math.hypot(mouse.x - p.x, mouse.y - p.y);
    if (l > 4) return { x: (mouse.x - p.x) / l, y: (mouse.y - p.y) / l };
  }
  const speed = Math.hypot(vx, vy);
  if (speed > 1) return { x: vx / speed, y: vy / speed };
  const l = Math.hypot(dashX, dashY) || 1;
  return { x: dashX / l, y: dashY / l };
}

function liveStats() {
  const stats = Rules.statsOf(gear);
  const balance = NET.active ? (NET.coins || 0) : gear.t;
  if (balance <= 0) {
    stats.core = null;
    stats.reward = 1;
    if (stats.warn > Rules.WARN_BASE) stats.warn = Rules.WARN_BASE;
    stats.dash = null;
  }
  return stats;
}

function takeCheckpoint() {
  checkpoint = {
    x: p.x,
    y: p.y,
    hp: hp,
    shield: shield,
    maxHp: maxHp,
    stars: stars.map(s => ({ id: s.id, x: s.x, y: s.y })),
  };
}

function useReset() {
  if (state !== 'play') return;
  if (currentItemCount('reset') <= 0) {
    noteGear(Rules.REASON.no_card);
    return;
  }
  if (NET.active) {
    NET.send({ type: 'reset' });
    return;
  }
  if (!checkpoint || !p) return;
  if (!Rules.spendItem(gear, 'reset')) {
    noteGear(Rules.REASON.no_card);
    return;
  }
  p.x = checkpoint.x;
  p.y = checkpoint.y;
  vx = 0;
  vy = 0;
  hp = checkpoint.hp;
  shield = checkpoint.shield;
  maxHp = checkpoint.maxHp;
  iframes = 0;
  dashLeft = 0;
  dashCd = 0;
  rec = [];
  t = 0;
  resetHold = true;
  stars = (checkpoint.stars || []).filter(s => !spentStars.has(s.id)).map(s => ({ id: s.id, x: s.x, y: s.y }));
  noteGear('这一轮重新开始');
  beep(520, 0.08, 'triangle', 0.1);
}

function tryDash() {
  if (state !== 'play') return;
  if (NET.active) {
    NET.send({ type: 'dash' });
    return;
  }
  const stats = liveStats();
  const level = campaignOn && profile ? (profile.level || 1) : 1;
  const dash = Rules.attackDash(stats, level, campaignOn);
  if (!dash || dashCd > 0 || dashLeft > 0) return;
  if (dash.paid && !Rules.payDash(gear)) {
    noteGear(Rules.REASON.not_enough_T);
    return;
  }
  const dir = facing();
  dashX = dir.x;
  dashY = dir.y;
  dashLeft = dash.frames;
  dashCd = dash.cd;
  dashMul = dash.speed;
  soloDashHits = {};
}

function movePlayer() {
  const dt = 1 / 60;
  if (dashLeft > 0 && p) {
    const stats = Rules.statsOf(gear);
    const mul = dashMul || (stats.dash ? stats.dash.speed : 1);
    const burst = unit() * 0.44 * mul;
    const len = Math.hypot(dashX, dashY) || 1;
    vx = dashX / len * burst;
    vy = dashY / len * burst;
    p.x += vx * dt;
    p.y += vy * dt;
    const m = bodyR() + 2;
    p.x = Math.max(m, Math.min(LW - m, p.x));
    p.y = Math.max(m, Math.min(LH - m, p.y));
    dashLeft--;
    return;
  }
  if (dashCd > 0) dashCd--;
  const max = moveSpeed();
  let ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (ix || iy) {
    const l = Math.hypot(ix, iy);
    ix /= l;
    iy /= l;
    mouse = null;
  } else if (mouse) {
    const ex = mouse.x - p.x;
    const ey = mouse.y - p.y;
    const l = Math.hypot(ex, ey);
    if (l > unit() * 0.008) { ix = ex / l; iy = ey / l; }
  }
  const k = 1 - Math.exp(-dt / 0.022);
  vx += (ix * max - vx) * k;
  vy += (iy * max - vy) * k;
  if (!ix && !iy && Math.hypot(vx, vy) < max * 0.04) { vx = 0; vy = 0; }
  let stepX = vx * dt;
  let stepY = vy * dt;
  if (mouse && !((keys.d || keys.a || keys.arrowleft || keys.arrowright || keys.w || keys.s || keys.arrowup || keys.arrowdown))) {
    const l = Math.hypot(mouse.x - p.x, mouse.y - p.y);
    const mag = Math.hypot(stepX, stepY);
    if (mag > l) { stepX *= l / mag; stepY *= l / mag; vx *= 0.35; vy *= 0.35; }
  }
  p.x += stepX;
  p.y += stepY;
  const m = bodyR() + 2;
  p.x = Math.max(m, Math.min(LW - m, p.x));
  p.y = Math.max(m, Math.min(LH - m, p.y));
}

function pullStars() {
  const stats = Rules.statsOf(gear);
  if (!stats.pull || !p) return;
  const scale = unit() / 540;
  const attract = stats.attract * scale;
  const pull = stats.pull * scale;
  stars.forEach(s => {
    const dist = Math.hypot(s.x - p.x, s.y - p.y);
    if (dist < 1 || dist > attract) return;
    const step = Math.min(pull, dist);
    s.x += (p.x - s.x) / dist * step;
    s.y += (p.y - s.y) / dist * step;
  });
}

function sufferEcho() {
  if (shield > 0) {
    shield--;
    iframes = Rules.IFRAMES;
    beep(880, 0.08, 'square', 0.08);
    boom(p.x, p.y, '#7ad7ff', 16);
    return false;
  }
  if (hp > 1) {
    hp--;
    iframes = Rules.IFRAMES;
    beep(180, 0.12, 'square', 0.12);
    boom(p.x, p.y, '#ff8a80', 18);
    shake = unit() * 0.012;
    return false;
  }
  die();
  return true;
}

function shopStep() {
  if (gearMsgT > 0) gearMsgT--;
  if (banner > 0) banner--;
  vx = 0;
  vy = 0;
  if (shopLeft > 0) shopLeft--;
  const warmed = shopLeft <= Rules.SHOP_STEPS - Rules.SHOP_MIN;
  if (shopLeft <= 0 || (warmed && shopReady)) endShop();
}

function step() {
  parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vx *= 0.96; q.vy *= 0.96; q.l--; });
  parts = parts.filter(q => q.l > 0);
  if (shake > 0) shake *= 0.86;
  if (gearMsgT > 0 && state !== 'shop') gearMsgT--;
  if (state === 'shop') return shopStep();
  if (banner > 0) banner--;
  if (state !== 'play') return;

  const dashing = dashLeft > 0;
  movePlayer();
  if (campaignOn && p) Rules.pushOut(p, walls, bodyR());
  const stats = Rules.statsOf(gear);
  const nudge = Rules.hallucinationNudge(rec.length + 1, stats.noise, soloSeed);
  if ((nudge.x || nudge.y) && p) {
    const edge = bodyR() + 2;
    p.x = Math.max(edge, Math.min(LW - edge, p.x + nudge.x));
    p.y = Math.max(edge, Math.min(LH - edge, p.y + nudge.y));
  }
  rec.push({x: p.x, y: p.y});
  t = rec.length - 1;
  if (campaignOn) {
    runCampaign(dashing);
    if (state !== 'play') return;
  }

  if (iframes > 0) iframes--;
  else if (!protecting()) {
    let hit = false;
    for (let i = 0; i < ghosts.length; i++) {
      const g = ghosts[i];
      const idx = Math.min(t, g.length - 1);
      if (campaignOn && echoHoles[i] && echoHoles[i][idx]) continue;
      const q = echoHead(g);
      if (q && Math.hypot(q.x - p.x, q.y - p.y) < collideDist()) { hit = true; break; }
    }
    if (hit && sufferEcho()) return;
  }

  pullStars();
  const got = collectR() * stats.magnet;
  stars = stars.filter(s => {
    if (Math.hypot(s.x - p.x, s.y - p.y) < got) {
      spentStars.add(s.id);
      const gain = liveStats().reward || 1;
      score += Math.round(Rules.SCORE_STAR * round * stats.score * gain);
      gear.t += Math.round(Rules.T_STAR * gain);
      if (profile || campaignOn) {
        loadProfile();
        Rules.bumpQuest(profile, 'stars', 1, null, todayKey());
        if (campaignOn) {
          const up = Rules.addXp(profile, 1);
          gear.t += up.bonus;
          noteLevels(up.levels);
        }
        saveProfile();
      }
      boom(s.x, s.y, '#ffd54a', 14);
      beep(600 + Math.random() * 400, 0.1, 'triangle', 0.12);
      return false;
    }
    return true;
  });
  let guard = 0;
  const cap = resetHold ? Math.max(0, starGoal() - spentStars.size) : starGoal();
  while (stars.length < cap && guard++ < 4) spawnStar();

  Rules.tickDrain(gear, Rules.statsOf(gear), rec.length);
  if (rec.length >= STEPS) finishRound();
}

function loadProfile() {
  if (profile) return profile;
  try {
    const saved = JSON.parse(localStorage.echoProfile || 'null');
    if (saved && saved.gear) profile = saved;
  } catch (e) {}
  if (!profile) profile = Rules.freshProfile();
  if (!profile.gear) profile.gear = Rules.emptyGear();
  profile.gear.level = profile.level || 1;
  return profile;
}

function saveProfile() {
  if (!profile) return;
  if (campaignOn) {
    profile.gear = Rules.cloneGear(gear);
    profile.gear.level = profile.level || 1;
  } else if (profile.gear) {
    profile.gear.level = profile.level || 1;
  }
  try { localStorage.echoProfile = JSON.stringify(profile); } catch (e) {}
}

function noteLevels(levels) {
  if (!levels || !levels.length) return;
  syncCampaignHearts(false);
  noteGear('升到 Lv' + levels[levels.length - 1] + (profile && profile.title ? ' ' + profile.title : ''));
}

function syncCampaignHearts(fill) {
  if (!campaignOn) return;
  const stats = Rules.statsOf(gear);
  const level = profile ? (profile.level || 1) : 1;
  gear.level = level;
  const next = Rules.heartsOf(level, stats.bonusHp);
  const gained = Math.max(0, next - maxHp);
  maxHp = next;
  if (fill) {
    hp = maxHp;
    shield = stats.blocks;
  } else if (gained && hp > 0) hp = Math.min(maxHp, hp + gained);
  else if (hp > maxHp) hp = maxHp;
}

function progressView() {
  if (NET.active) {
    return {
      level: NET.level || 1,
      xp: NET.xp || 0,
      xpNext: NET.xpNext || 0,
      title: NET.title || '',
      unlocked: NET.unlocked || 1,
      quests: NET.quests || [],
      stageName: NET.stageName || stageLabel || '',
    };
  }
  if (profile || campaignOn || board) loadProfile();
  if (!profile) {
    return { level: 1, xp: 0, xpNext: Rules.xpToNext(1), title: '', unlocked: 1, quests: [], stageName: stageLabel || '' };
  }
  const stage = campaignOn ? Rules.stageById(stageId) : null;
  return {
    level: profile.level || 1,
    xp: profile.xp || 0,
    xpNext: Rules.xpToNext(profile.level || 1),
    title: profile.title || '',
    unlocked: profile.unlocked || 1,
    quests: Rules.questBoard(profile, todayKey()),
    stageName: stage ? stage.name : (stageLabel || ''),
  };
}

function startCampaign(id) {
  const row = Rules.stageById(id);
  loadProfile();
  if (!row || row.id > (profile.unlocked || 1)) {
    noteGear(Rules.REASON.locked);
    return;
  }
  const seedQuery = new URLSearchParams(location.search).get('seed');
  if (seedQuery != null && seedQuery !== '') soloSeed = (Number(seedQuery) >>> 0);
  else soloSeed = (Math.random() * 0x100000000) >>> 0;
  campaignOn = true;
  stageId = row.id;
  stageLabel = row.name;
  stageDamage = 0;
  questOpen = false;
  board = '';
  deathCause = '';
  gear = Rules.cloneGear(profile.gear);
  gear.level = profile.level || 1;
  chooseArena();
  layout();
  clearHeldInput();
  placeAtSeat(0);
  ghosts = [];
  echoHoles = [];
  rec = [];
  t = 0;
  round = 1;
  score = 0;
  stars = [];
  parts = [];
  shake = 0;
  banner = 0;
  syncCampaignHearts(true);
  iframes = 0;
  dashLeft = 0;
  dashCd = 0;
  shopLeft = 0;
  shopReady = false;
  walls = row.walls || [];
  monsters = Rules.spawnWave(row, 1, soloSeed);
  shots = [];
  drops = [];
  soloDashHits = {};
  spawnStar();
  spawnStar();
  spentStars = new Set();
  resetHold = false;
  takeCheckpoint();
  state = 'play';
  noteGear('');
}

function runCampaign(dashing) {
  if (!campaignOn) return;
  const stage = Rules.stageById(stageId);
  Rules.pushOut(p, walls, bodyR());
  const wrapped = ghosts.map((pts, i) => ({ pts: pts, eaten: echoHoles[i] || (echoHoles[i] = {}), t: t }));
  Rules.stepMonsters(monsters, [{ x: p.x, y: p.y, mode: 'play' }], wrapped, stage, round, walls);
  Rules.eatEchoes(monsters, wrapped);
  Rules.kingBarrage(monsters, wrapped, [{ x: p.x, y: p.y, mode: 'play' }], shots, rec.length, soloSeed);
  Rules.stepShots(shots, walls);
  const body = { id: 'solo', x: p.x, y: p.y, hp: hp, iframes: iframes, r: bodyR(), dashHits: soloDashHits, mode: 'play' };
  const events = Rules.fightMonsters(body, monsters, shots, dashing);
  hp = body.hp;
  iframes = body.iframes;
  soloDashHits = body.dashHits;
  events.forEach(event => {
    if (event.type === 'smack') boom(event.x, event.y, '#fff', 10);
    if (event.type === 'bite') {
      stageDamage++;
      boom(event.x, event.y, '#ff8a80', 12);
    }
  });
  const today = todayKey();
  const reaped = Rules.reapMonsters(monsters, soloSeed, rec.length);
  reaped.killed.forEach(mon => {
    boom(mon.x, mon.y, mon.color || '#fff', 16);
    Rules.bumpQuest(profile, 'kills', 1, null, today);
    if (mon.kind === 'king') Rules.bumpQuest(profile, 'king-v2', 1, { v2: Rules.wornV2(gear) }, today);
  });
  drops = drops.concat(reaped.drops);
  drops = drops.filter(drop => {
    if (Math.hypot(drop.x - p.x, drop.y - p.y) >= 24) return true;
    const levels = Rules.takeDrop(gear, profile, drop);
    gear.level = profile.level || 1;
    noteLevels(levels);
    beep(720, 0.08, 'triangle', 0.1);
    return false;
  });
  if (hp <= 0) {
    saveProfile();
    const bite = events.filter(event => event.type === 'bite').pop();
    die(bite ? ('被' + bite.by + '打倒了') : '被怪物打倒了');
  }
}

function echoHead(g) {
  if (!g || !g.length) return null;
  const wearer = {
    x: p ? p.x : 0,
    y: p ? p.y : 0,
    vx: vx,
    vy: vy,
    core: Rules.mergeCore(liveStats().core, campaignOn ? Rules.stageEcho(Rules.stageById(stageId), round) : null),
    w: LW,
    h: LH,
  };
  return Rules.echoAt(g, Math.max(0, t), wearer);
}

function strokeRange(ctx, pts, a, b, style, width, holes) {
  if (!pts || b - a < 1) return;
  ctx.beginPath();
  ctx.strokeStyle = style;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let moved = false;
  for (let i = a; i <= b && i < pts.length; i++) {
    if (i < 0) continue;
    if (holes && holes[i]) { moved = false; continue; }
    const q = pts[i];
    if (!moved) { ctx.moveTo(q.x, q.y); moved = true; }
    else ctx.lineTo(q.x, q.y);
  }
  if (moved) ctx.stroke();
}

function protecting() {
  // Online matches draw from the server grace bit. Solo uses the same
  // predicate the room uses: ghosts are present and the round tick is < 60.
  if (NET.active) return !!NET.grace;
  return Rules.protecting(ghosts.length, t);
}

function warnLead() {
  if (NET.active) {
    const mine = NET.myPlayer();
    return mine && mine.warnAt ? mine.warnAt : Rules.WARN_BASE;
  }
  return liveStats().warn;
}

function viewAsItem(v) {
  return {
    uid: v.uid,

    tier: v.tier || 0,
    affixes: v.affixes || [],
    negative: v.negative || null,

    price: v.price || 0,
  };
}

function wornGear() {
  if (NET.active) {
    const mine = NET.myPlayer();
    return mine && mine.gear ? mine.gear : [];
  }
  return Rules.publicGear(gear);
}

function currentOffers() {
  return NET.active ? (NET.offers || []) : Rules.offers(gear);
}

function currentBag() {
  return NET.active ? (NET.bag || []) : Rules.bagView(gear);
}

function currentCoins() {
  return NET.active ? (NET.coins || 0) : gear.t;
}

function tokenText(n) {
  return 'token 余额 ' + n;
}

function currentItemCount(id) {
  let n = 0;
  currentBag().forEach(entry => {
    if (entry && entry.kind === 'card' && entry.id === id) n += entry.count || 0;
  });
  return n;
}

function currentShopLeft() {
  return NET.active ? (NET.shopLeft || 0) : shopLeft;
}

function noteGear(text) {
  gearMsg = text || '';
  gearMsgT = text ? 150 : 0;
}

function actShop(hit) {
  if (!hit) return;
  if (NET.active) {
    if (hit.act === 'buy') NET.send({ type: 'buy', id: hit.uid });
    else if (hit.act === 'buyItem') NET.send({ type: 'buyItem', id: hit.id });
    else if (hit.act === 'train') NET.send({ type: 'train', id: hit.uid });
    else if (hit.act === 'equip') NET.send({ type: 'equip', id: hit.uid });
    else if (hit.act === 'unequip') NET.send({ type: 'unequip', slot: hit.slot });
    else if (hit.act === 'ready') NET.send({ type: 'ready' });
    return;
  }
  let result = { ok: true, reason: '' };
  if (hit.act === 'buy') result = Rules.buy(gear, hit.uid);
  else if (hit.act === 'buyItem') result = Rules.buyItem(gear, hit.id);
  else if (hit.act === 'train') result = Rules.train(gear, hit.uid);
  else if (hit.act === 'equip') result = Rules.equip(gear, hit.uid);
  else if (hit.act === 'unequip') result = Rules.unequip(gear, hit.slot);
  else if (hit.act === 'ready') { shopReady = true; return; }
  if (!result.ok) noteGear(Rules.REASON[result.reason] || result.reason);
  else {
    noteGear('');
    if (campaignOn) {
      syncCampaignHearts(true);
      saveProfile();
    } else {
      const stats = Rules.statsOf(gear);
      maxHp = stats.maxHp;
      hp = maxHp;
      shield = stats.blocks;
    }
  }
}

function roundProgress() {
  if (NET.active && NET.state === 'play') return NET.step;
  return rec.length;
}

function ghostColor(i, a) {
  return 'hsla(' + ((328 + i * 19) % 360) + ',88%,64%,' + (a == null ? 1 : a) + ')';
}

function echoFlicker() {
  return Math.floor(t / 2) % 2 === 0 ? 0.5 : 0.15;
}

function drawFootRing(q, dashed) {
  // Sprite pixel (24, 46) is already drawn on q, and collision uses q too.
  // The old center sat bodyR+4 below that, about 15px under the feet.
  const cx = q.x;
  const cy = q.y;
  const radius = 4;
  x.save();
  x.setLineDash(dashed ? [2, 2] : []);
  x.save();
  x.beginPath();
  x.rect(cx - 16, cy - 16, 32, 32);
  x.arc(cx, cy, radius, 0, Math.PI * 2, true);
  x.clip('evenodd');
  x.beginPath();
  x.strokeStyle = '#000';
  x.lineWidth = 6;
  x.arc(cx, cy, radius, 0, Math.PI * 2);
  x.stroke();
  x.restore();
  x.beginPath();
  x.strokeStyle = '#fff';
  x.lineWidth = 2;
  x.arc(cx, cy, radius, 0, Math.PI * 2);
  x.stroke();
  x.restore();
}

function drawSpark(sx, sy, r) {
  x.beginPath();
  for (let i = 0; i < 8; i++) {
    const rad = i % 2 ? r * 0.42 : r;
    const a = -Math.PI / 2 + i * Math.PI / 4;
    const px = sx + Math.cos(a) * rad;
    const py = sy + Math.sin(a) * rad;
    if (i) x.lineTo(px, py); else x.moveTo(px, py);
  }
  x.closePath();
  x.fill();
}

function drawBadges(px, py, list, above) {
  if (!list || !list.length) return;
  const start = px - ((list.length - 1) * 14) / 2;
  list.forEach((g, i) => {
    const bx = start + i * 14;
    const by = above != null ? above : py - bodyR() - 18;
    x.beginPath();
    x.fillStyle = g.color || '#fff';
    x.arc(bx, by, 6, 0, Math.PI * 2);
    x.fill();
    x.fillStyle = '#1a1020';
    x.font = 'bold 8px ui-sans-serif,system-ui,sans-serif';
    x.textAlign = 'center';
    x.fillText(g.mark, bx, by + 3);
  });
}

function pickRole(id) {
  const role = Rules.roleById(id);
  if (!role) return;
  roleId = role.id;
  try { localStorage.echoRole = role.id; } catch (e) {}
  if (NET.active) NET.send({ type: 'role', id: role.id });
}

function faceRow(id, vx, vy) {
  const speed = Math.hypot(vx || 0, vy || 0);
  if (speed > 8) {
    faceRows[id] = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? 1 : 2) : (vy < 0 ? 3 : 0);
  }
  return faceRows[id] || 0;
}

function echoRow(g, i) {
  const n = Math.min(Math.max(t, 0), g.length - 1);
  const q = g[n];
  const prev = g[Math.max(0, n - 1)] || q;
  if (!q || !prev) return 0;
  return faceRow('echo-' + i, (q.x - prev.x) * 60, (q.y - prev.y) * 60);
}

function shopPanel() {
  return { x: 28, y: 12, w: LW - 56, h: LH - 24 };
}

function placeInShop(px, py, role) {
  if (state !== 'shop') return { x: px, y: py };
  const panel = shopPanel();
  const sheeted = !!(role && role.sheet);
  const padX = sheeted ? 28 : 18;
  const padTop = sheeted ? 50 : 20;
  const padBot = sheeted ? 16 : 18;
  return {
    x: Math.max(panel.x + padX, Math.min(panel.x + panel.w - padX, px)),
    y: Math.max(panel.y + padTop, Math.min(panel.y + panel.h - padBot, py)),
  };
}

function drawSprite(ctx, px, py, id, row, moving, alpha, scale, colOverride) {
  const role = Rules.roleById(id);
  const img = role && sheets[role.id];
  if (!role || !role.sheet || !img || !img.complete || !img.naturalWidth) return false;
  const spec = Rules.SPRITE;
  const zoom = scale || 1;
  const col = colOverride != null ? colOverride : (moving ? 2 + (Math.floor(Date.now() / 120) % spec.walk) : (Math.floor(Date.now() / 360) % spec.idle));
  const prev = ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (alpha != null) ctx.globalAlpha *= alpha;
  ctx.drawImage(
    img,
    col * spec.frame,
    row * spec.frame,
    spec.frame,
    spec.frame,
    px - spec.footX * zoom,
    py - spec.footY * zoom,
    spec.frame * zoom,
    spec.frame * zoom
  );
  ctx.restore();
  ctx.imageSmoothingEnabled = prev;
  return true;
}

function drawPips(px, py, hearts, cap, blocks) {
  if ((cap || 1) <= 1 && !blocks) return;
  const n = Math.max(cap || 1, hearts || 0);
  const start = px - ((n - 1) * 8) / 2;
  for (let i = 0; i < n; i++) {
    x.fillStyle = i < hearts ? '#ff8a80' : 'rgba(255,255,255,.25)';
    x.fillRect(start + i * 8 - 2, py + bodyR() + 4, 4, 4);
  }
  if (blocks) {
    x.fillStyle = '#7ad7ff';
    x.font = '10px ui-sans-serif,system-ui,sans-serif';
    x.textAlign = 'left';
    x.fillText('盾' + blocks, px + bodyR() + 4, py + 4);
  }
}

function drawWorld() {
  x.strokeStyle = 'rgba(255,255,255,.1)';
  x.lineWidth = 2;
  x.strokeRect(1, 1, LW - 2, LH - 2);
  walls.forEach(wall => {
    x.fillStyle = 'rgba(154,176,255,.16)';
    x.strokeStyle = 'rgba(255,255,255,.38)';
    x.lineWidth = 1;
    x.fillRect(wall.x, wall.y, wall.w, wall.h);
    x.strokeRect(wall.x, wall.y, wall.w, wall.h);
  });

  if (state !== 'menu') {
    const safe = protecting();
    if (echoLayer.width !== c.width || echoLayer.height !== c.height) {
      echoLayer.width = c.width;
      echoLayer.height = c.height;
    }
    ex.setTransform(1, 0, 0, 1, 0, 0);
    ex.clearRect(0, 0, echoLayer.width, echoLayer.height);
    ex.save();
    ex.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);
    ex.globalAlpha = 1;
    if (state === 'shop') {
      const panel = shopPanel();
      ex.beginPath();
      ex.rect(panel.x, panel.y, panel.w, panel.h);
      ex.clip();
    }
    ghosts.forEach((g, i) => {
      const n = Math.min(t, g.length - 1);
      const age = ghosts.length - 1 - i;
      const holes = echoHoles[i];
      const eatenHead = holes && holes[n];
      const head = eatenHead ? null : echoHead(g);
      const q = head || g[Math.max(0, n)];
      strokeRange(ex, g, 0, g.length - 1, ghostColor(i, Math.max(0.28, 0.58 - age * 0.05)), 3.2, holes);
      strokeRange(ex, g, n - 28, n, ghostColor(i, 0.9), 3, holes);
      strokeRange(ex, g, n, Math.min(g.length - 1, n + 32), ghostColor(i, 1), 3.6, holes);
      if (head && (head.x !== head.baseX || head.y !== head.baseY)) {
        ex.strokeStyle = '#ffcc66';
        ex.lineWidth = 2;
        ex.setLineDash([3, 3]);
        ex.beginPath();
        ex.moveTo(head.baseX, head.baseY);
        ex.lineTo(head.x, head.y);
        ex.stroke();
        ex.setLineDash([]);
      }
      const echoRole = (NET.ghostMeta && NET.ghostMeta[i] && NET.ghostMeta[i].role) || roleId;
      const spot = q && state !== 'shop' ? placeInShop(q.x, q.y, Rules.roleById(echoRole)) : null;
      const echoed = !eatenHead && spot && drawSprite(ex, spot.x, spot.y, echoRole, echoRow(g, i), false, 0.72, 1);
      if (!eatenHead && spot && !echoed) {
        ex.fillStyle = ghostColor(i, 0.95);
        ex.beginPath();
        ex.arc(spot.x, spot.y, bodyR(), 0, Math.PI * 2);
        ex.fill();
      }
      if (!eatenHead && spot) {
        ex.strokeStyle = ghostColor(i, 0.55);
        ex.lineWidth = 1.5;
        ex.beginPath();
        ex.arc(spot.x, spot.y, Math.max(bodyR() + 2, collideDist() - bodyR()), 0, Math.PI * 2);
        ex.stroke();
      }
    });
    ex.restore();
    x.save();
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalAlpha = safe ? echoFlicker() : 1;
    x.drawImage(echoLayer, 0, 0);
    x.restore();
    ghosts.forEach((g, i) => {
      const n = Math.min(t, g.length - 1);
      if (echoHoles[i] && echoHoles[i][n]) return;
      const head = echoHead(g);
      if (head && state !== 'shop') {
        const role = (NET.ghostMeta && NET.ghostMeta[i] && NET.ghostMeta[i].role) || roleId;
        const foot = placeInShop(head.x, head.y, Rules.roleById(role));
        drawFootRing(foot, safe);
      }
    });

    const trailColor = NET.active && NET.color && NET.fade ? NET.fade(NET.color, 0.78) : 'rgba(130,220,255,.78)';
    if (rec.length > 1) strokeRange(x, rec, 0, rec.length - 1, trailColor, 2.6);

    const warn = state === 'play' && roundProgress() >= STEPS - warnLead();
    if (warn) {
      const marks = [];
      ghosts.forEach(g => { if (g[0]) marks.push(g[0]); });
      if (rec[0]) marks.push(rec[0]);
      marks.forEach(q => {
        const rad = bodyR() + unit() * 0.028 + Math.sin(roundProgress() / 3) * 1.5;
        x.strokeStyle = '#ffe082';
        x.lineWidth = 2;
        x.beginPath();
        x.arc(q.x, q.y, rad, 0, Math.PI * 2);
        x.moveTo(q.x - rad - 4, q.y); x.lineTo(q.x + rad + 4, q.y);
        x.moveTo(q.x, q.y - rad - 4); x.lineTo(q.x, q.y + rad + 4);
        x.stroke();
      });
    }

    stars.forEach(s => {
      x.fillStyle = '#ffd54a';
      drawSpark(s.x, s.y, bodyR() * 0.85 + Math.sin(Date.now() / 160) * 1.4);
    });

    monsters.forEach(mon => {
      x.fillStyle = mon.color || '#fff';
      x.beginPath();
      x.arc(mon.x, mon.y, mon.r || 11, 0, Math.PI * 2);
      x.fill();
      x.strokeStyle = 'rgba(0,0,0,.45)';
      x.lineWidth = 2;
      x.stroke();
      x.fillStyle = '#fff';
      x.font = '12px ui-sans-serif,system-ui,sans-serif';
      x.textAlign = 'center';
      x.fillText(mon.name || '', mon.x, mon.y - (mon.r || 11) - 8);
      const bw = 26;
      const by = mon.y + (mon.r || 11) + 4;
      x.fillStyle = 'rgba(0,0,0,.45)';
      x.fillRect(mon.x - bw / 2, by, bw, 3);
      x.fillStyle = '#ff8a80';
      x.fillRect(mon.x - bw / 2, by, bw * Math.max(0, (mon.hp || 0) / (mon.maxHp || 1)), 3);
    });
    shots.forEach(shot => {
      x.fillStyle = '#ffd0ea';
      x.beginPath();
      x.arc(shot.x, shot.y, shot.r || 5, 0, Math.PI * 2);
      x.fill();
    });
    drops.forEach(drop => {
      x.fillStyle = drop.kind === 'gear' ? '#9ad0ff' : '#ffec27';
      drawSpark(drop.x, drop.y, 8);
    });

    if (p && state !== 'menu' && state !== 'shop') {
      const shown = placeInShop(p.x, p.y, Rules.roleById(roleId));
      if (!NET.active) {
        const wornRole = Rules.roleById(roleId);
        drawBadges(shown.x, shown.y, wornGear(), wornRole && wornRole.sheet ? shown.y - Rules.SPRITE.footY - 10 : null);
        drawPips(shown.x, shown.y, hp, maxHp, shield);
      }
      const moving = Math.hypot(vx, vy) > 8;
      const painted = drawSprite(x, shown.x, shown.y, roleId, faceRow('self', vx, vy), moving, iframes > 0 && Math.floor(t / 2) % 2 === 0 ? 0.35 : 1, 1);
      if (!painted) {
      x.save();
      if (iframes > 0 && Math.floor(t / 2) % 2 === 0) x.globalAlpha = 0.35;
      x.fillStyle = NET.active && NET.color ? NET.color : ((Rules.roleById(roleId) || {}).color || '#7ad7ff');
      x.shadowColor = '#6cf';
      x.shadowBlur = 18;
      x.beginPath();
      x.arc(shown.x, shown.y, bodyR(), 0, Math.PI * 2);
      x.fill();
      x.shadowBlur = 0;
      x.restore();
      }
    }
  }

  parts.forEach(q => {
    x.globalAlpha = Math.max(0, q.l / 28);
    x.fillStyle = q.col;
    x.fillRect(q.x, q.y, 3, 3);
    x.globalAlpha = 1;
  });

  if (state === 'play') {
    const left = Math.max(0, STEPS - roundProgress()) / 60;
    const hot = roundProgress() >= STEPS - warnLead();
    x.fillStyle = 'rgba(255,255,255,.12)';
    x.fillRect(16, LH - 14, LW - 32, 5);
    x.fillStyle = hot ? '#ff8a80' : '#6cf';
    x.fillRect(16, LH - 14, (LW - 32) * (1 - left / 6), 5);
    x.font = 'bold ' + Math.round(unit() * 0.04) + 'px ui-sans-serif,system-ui,sans-serif';
    x.textAlign = 'center';
    if (banner > 0) {
      x.globalAlpha = Math.min(1, banner / 20);
      x.fillStyle = '#fff';
      x.fillText('回声 +1', LW / 2, 42);
      x.globalAlpha = 1;
    }
    if (protecting()) {
      x.fillStyle = '#ffe082';
      x.fillText('离开路线', LW / 2, banner > 0 ? 78 : 42);
    }
  }
}

    x.fillStyle = 'rgba(255,255,255,.92)';
    const lines = [
      '每 6 秒一轮。走过的路变成回声，碰到就输了',
      '空格开始无尽。闯关、打怪用同一个角色',
      '轮间用 token 训练装备。头、身、饰品都能穿',
    ];
    const lineGap = bodyPx + 8;
    const firstLine = titleY + Math.ceil(titlePx * 0.55) + bodyPx;
    lines.forEach((s, i) => x.fillText(s, LW / 2, firstLine + i * lineGap));
    const textBottom = firstLine + (lines.length - 1) * lineGap + Math.ceil(bodyPx * 0.45);
    const roles = Rules.CAST;
    const gap = Math.max(12, Math.min(28, Math.round(LW * 0.03)));
    let cardW = Math.min(210, Math.floor((LW - 32 - gap * (roles.length - 1)) / roles.length));
    let cardH = Math.min(250, Math.round(cardW * 1.15));
    let y0 = textBottom + 16;
    if (y0 + cardH > LH - 64) cardH = Math.max(150, LH - 64 - y0);
    if (y0 + cardH > LH - 64) y0 = Math.max(textBottom + 8, LH - 64 - cardH);
    const total = roles.length * cardW + (roles.length - 1) * gap;
    const x0 = (LW - total) / 2;
    const cardScale = cardH / 250;
    roles.forEach((role, i) => {
      const hx = x0 + i * (cardW + gap);
      const picked = role.id === roleId;
      x.fillStyle = picked ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.03)';
      x.strokeStyle = picked ? '#fff' : 'rgba(255,255,255,.35)';
      x.lineWidth = picked ? 2 : 1;
      x.strokeRect(hx, y0, cardW, cardH);
      x.fillRect(hx, y0, cardW, cardH);
      const footX = hx + cardW / 2;
      const footY = y0 + 150 * cardScale;
      if (!drawSprite(x, footX, footY, role.id, 0, false, 1, 2 * cardScale)) {
        x.fillStyle = role.color || '#7ad7ff';
        x.beginPath();
        x.arc(footX, footY - 36 * cardScale, 28 * cardScale, 0, Math.PI * 2);
        x.fill();
      }
      x.fillStyle = '#fff';
      x.font = 'bold ' + Math.max(14, Math.round(18 * cardScale)) + 'px ui-sans-serif,system-ui,sans-serif';
      x.textAlign = 'center';
      x.fillText(role.name, footX, y0 + 188 * cardScale);
      x.font = Math.max(11, Math.round(13 * cardScale)) + 'px ui-sans-serif,system-ui,sans-serif';
      x.fillStyle = 'rgba(255,255,255,.78)';
      x.fillText(role.blurb, footX, y0 + 210 * cardScale);
      x.fillText((role.slots || []).map(slot => Rules.SLOT_NAME[slot]).join(' · '), footX, y0 + 232 * cardScale);
      castHits.push({ x: hx, y: y0, w: cardW, h: cardH, id: role.id });
    });
    x.textAlign = 'center';
  }
  if (state === 'over') {
    const lines = roundDeathLines();
    drawEndCard(
      lines[0],
      overDetail(),
      campaignOn ? '空格或点击画面 重试这一关' : '空格或点击画面 再来一局',
      lines
    );
  }
  if (state === 'clear') {
    drawEndCard(gearMsg || '这一关打通了', '下一关已解锁', '空格打开选关');
  }
}

function actBoard(hit) {
  if (!hit) return;
  if (hit.act === 'stage') {
    board = '';
    if (NET.active) NET.send({ type: 'campaign', stage: hit.id });
    else startCampaign(hit.id);
    return;
  }
  if (NET.active) {
    NET.send({ type: hit.act === 'accept' ? 'accept' : 'turnin', id: hit.id });
    return;
  }
  loadProfile();
  const today = todayKey();
  if (hit.act === 'accept') {
    const result = Rules.acceptQuest(profile, hit.id, today);
    if (!result.ok) noteGear(Rules.REASON[result.reason] || result.reason);
  } else if (hit.act === 'turnin') {
    const wallet = campaignOn ? gear : profile.gear;
    const result = Rules.turnInQuest(profile, hit.id, today, wallet);
    if (!result.ok) noteGear(Rules.REASON[result.reason] || result.reason);
    else if (campaignOn) syncCampaignHearts(false);
  }
  saveProfile();
}

function draw() {
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.fillStyle = '#0b0d1a';
  x.fillRect(0, 0, c.width, c.height);
  x.setTransform(view.dpr * view.s, 0, 0, view.dpr * view.s, view.dpr * view.ox, view.dpr * view.oy);
  x.save();
  if (shake > 0) x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawWorld();
  x.restore();
  drawOverlay();
  if (state === 'shop') drawShop();
  if (state === 'play') drawResetButton();
  if (board) drawBoard();

  if (state === 'play' || state === 'shop' || state === 'clear') {
    const left = Math.max(0, STEPS - roundProgress()) / 60;
    const wornStats = Rules.statsOf(gear);
    const live = liveStats();
    const prog = progressView();
    const coreBit = live.core ? (live.core.kind === 'predict' ? '  预判核' : '  回避核') : (wornStats.core ? '  推理暂停' : '');
    const noiseBit = wornStats.noise ? '  幻觉' : '';
    const campBit = campaignOn ? ('  ' + (prog.stageName || '') + '  Lv' + prog.level + (prog.title ? ' ' + prog.title : '') + '  XP ' + prog.xp + '/' + (prog.xpNext || '满') + (Rules.slowMul(Rules.stageById(stageId), round) < 1 ? '  放慢' : '')) : '';
    const questBit = (prog.quests || []).filter(q => q.status === 'accepted' || q.status === 'done').map(q => q.name + ' ' + q.progress + '/' + q.goal).join('  ');
    const bits = state === 'shop'
      ? ('推理  ' + tokenText(currentCoins()) + '  ' + (currentShopLeft() / 60).toFixed(1) + 's' + coreBit + campBit)
      : (state === 'clear'
        ? ((gearMsg || '过关') + '  ' + tokenText(currentCoins()) + campBit)
        : ('第 ' + round + ' 轮  得分 ' + score + '  ' + tokenText(currentCoins()) + '  回声 ' + ghosts.length + '  最佳 ' + best + '  ' + left.toFixed(1) + 's' + (hp > 0 && maxHp > 1 ? '  HP' + hp : '') + (shield ? '  盾' + shield : '') + '  ' + ((Rules.roleById(roleId) || {}).name || '') + coreBit + noiseBit + campBit + (protecting() ? '  离开路线' : '') + (questBit ? '  ' + questBit : '')));
    ui.textContent = bits + (gearMsg && state === 'play' ? '  ' + gearMsg : '') + (NET.active ? NET.hudSuffix() : '');
  } else ui.textContent = '';
  const dock = document.getElementById('dock');
  if (dock && !NET.active) dock.hidden = state === 'shop';
  syncMenuButtons();
}

function syncMenuButtons() {
  const onMenu = state === 'menu';
  ['campaign', 'quests', 'multi'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.hidden = !onMenu;
  });
}

window.__echo = function () {

    }),

window.__echoShop = function (hit) {

function listedDeaths() {
  if (!NET.active) return deathCause ? [deathCause] : [];
  return (NET.roundDeaths || []).map((row) => row.line);
}

function roundDeathLines() {
  const lines = listedDeaths();
  if (lines.length) return lines;

  return ['撞上了过去的自己'];
}

function overHeadline() {
  return roundDeathLines()[0];
}

function overDetail() {
  if (!NET.active) return '得分 ' + score + '  ·  撑过 ' + (round - 1) + ' 轮  ·  最佳 ' + best;

const BLOCK = new Set([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright']);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (BLOCK.has(k)) e.preventDefault();
  keys[k] = 1;
  if (k === 'shift' || k === 'k') tryDash();
  if (state === 'shop' && k >= '1' && k <= '3') {
    const offer = currentOffers()[+k - 1];
    if (offer) actShop({ act: 'buy', uid: offer.uid });
  }
  if (k === 'r' && state === 'play') useReset();
  if (state === 'shop' && k >= '4' && k <= '6') {
    const slot = Rules.slotsOf(roleId)[+k - 4];
    const worn = wornGear().filter(g => g.slot === slot)[0];
    if (worn) actShop({ act: 'train', uid: worn.uid });
  }
  if (k === 'q' && !e.repeat && state !== 'shop') board = board === 'quests' ? '' : 'quests';
  if (k === 'escape' && !e.repeat) {
    if (NET.active && (state === 'play' || state === 'shop')) {
      NET.leave();
      return;
    }
    if (!NET.active && (state === 'shop' || state === 'over' || state === 'clear')) {
      returnToMenu();
      return;
    }
  }
  if ((k === ' ' || k === 'enter') && state !== 'play') {
    if (board) { board = ''; return; }
    if (state === 'shop') actShop({ act: 'ready' });
    else reset();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });

function pointFrom(e) {
  const src = e.touches ? e.touches[0] : e;
  mouse = toLogical(src.clientX, src.clientY);
}
c.onmousemove = pointFrom;
c.onmousedown = e => {
  pointFrom(e);
  if (board) {
    const hit = boardHitAt(mouse);
    if (hit) actBoard(hit);
    else board = '';
    mouse = null;
    return;
  }
  if (state === 'menu' && castHitAt(mouse)) {
    pickRole(castHitAt(mouse).id);
    mouse = null;
    return;
  }
  if (state === 'shop') {
    const hit = shopHitAt(mouse);
    if (hit) { actShop(hit); mouse = null; }
    return;
  }
  if (state === 'play' && playHitAt(mouse)) {
    useReset();
    mouse = null;
    return;
  }
  if (!NET.active && (state === 'over' || state === 'clear')) {
    const endHit = endHitAt(mouse);
    if (endHit && endHit.act === 'menu') {
      returnToMenu();
      mouse = null;
      return;
    }
  }
  if (state !== 'play') reset();
};
c.ontouchstart = e => {
  pointFrom(e);
  if (board) {
    const hit = boardHitAt(mouse);
    if (hit) actBoard(hit);
    else board = '';
    mouse = null;
    e.preventDefault();
    return;
  }
  if (state === 'menu' && castHitAt(mouse)) {
    pickRole(castHitAt(mouse).id);
    mouse = null;
    e.preventDefault();
    return;
  }
  if (state === 'shop') {
    const hit = shopHitAt(mouse);
    if (hit) { actShop(hit); mouse = null; }
    e.preventDefault();
    return;
  }
  if (state === 'play' && playHitAt(mouse)) {
    useReset();
    mouse = null;
    e.preventDefault();
    return;
  }
  if (!NET.active && (state === 'over' || state === 'clear')) {
    const endHit = endHitAt(mouse);
    if (endHit && endHit.act === 'menu') {
      returnToMenu();
      mouse = null;
      e.preventDefault();
      return;
    }
  }
  if (state !== 'play') reset();
  e.preventDefault();
};
c.ontouchmove = e => { pointFrom(e); e.preventDefault(); };
c.oncontextmenu = e => e.preventDefault();

addEventListener('resize', () => {
  if (state !== 'play') chooseArena();
  layout();
});

chooseArena();
layout();

let acc = 0;
let last = performance.now();
function frame(now) {
  let dt = now - last;
  last = now;
  if (dt < 0) dt = 0;
  if (dt > 250) dt = 250;
  acc += dt;
  let n = 0;
  while (acc >= 1000 / 60 && n++ < 8) {
    step();
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(frame);
}

NET.myPlayer = function () {
  const players = (this.snap && this.snap.players) || [];
  for (let i = 0; i < players.length; i++) if (players[i].id === this.id) return players[i];
  return null;
};

NET.hudSuffix = function () {
  const n = (this.snap && this.snap.players) ? this.snap.players.length : 0;
  return '  在线 ' + n + (this.state === 'play' && this.deathText ? '  ' + this.deathText : '');
};

NET.fade = function (hex, a) {
  const n = parseInt(String(hex || '#7ad7ff').slice(1), 16);
  if (!Number.isFinite(n)) return 'rgba(122,215,255,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
};

NET.note = function (text) {
  const el = document.getElementById('netmsg');
  if (el) el.textContent = text || '';
};

NET.readInput = function () {
  const ax = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  const ay = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  const keyboard = !!(keys.d || keys.a || keys.arrowleft || keys.arrowright || keys.w || keys.s || keys.arrowup || keys.arrowdown);
  return { type: 'input', ax, ay, mouse: mouse ? { x: mouse.x, y: mouse.y } : null, keyboard, round };
};

NET.send = function (msg) {
  if (!this.ws || this.ws.readyState !== 1) return;
  if (this.ws.bufferedAmount > 1e6) return;
  this.ws.send(JSON.stringify(msg));
};

NET.trailOf = function (id) {
  const trails = (this.snap && this.snap.trails) || [];
  for (let i = 0; i < trails.length; i++) if (trails[i].id === id) return trails[i].pts || [];
  return [];
};

NET.lockArena = function () {
  if (LW === CAP_W && LH === CAP_H) return;
  LW = CAP_W;
  LH = CAP_H;
  layout();
};

NET.ownerName = function (ownerId) {
  if (!ownerId || !this.snap) return '';
  const players = this.snap.players || [];
  for (let i = 0; i < players.length; i++) {
    if (players[i].id === ownerId && players[i].name) return players[i].name;
  }
  const ghosts = this.snap.ghosts || [];
  for (let i = 0; i < ghosts.length; i++) {
    if (ghosts[i].ownerId === ownerId && ghosts[i].name) return ghosts[i].name;
  }
  return '';
};

NET.clearRoundDeaths = function () {
  this.roundDeaths = [];
  this.deathText = '';
};

NET.applyEvents = function (events) {
  if ((events || []).some((ev) => ev.type === 'round')) this.clearRoundDeaths();
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    if (ev.type === 'die') {
      const owner = this.ownerName(ev.ghost_owner_id);
      this.roundDeaths = Rules.recordRoundDeath(this.roundDeaths, ev, owner);
      this.deathText = Rules.echoDeathLine(ev.victim_id, ev.ghost_owner_id, owner, ev.victim_name);
      if (ev.victim_id === this.id) {
        boom(ev.x, ev.y, '#f55', 48);
        beep(110, 0.5, 'sawtooth', 0.25);
        shake = unit() * 0.02;
      } else boom(ev.x, ev.y, '#f55', 24);
    } else if (ev.type === 'boss') {
      this.deathText = '回声王还在';
    } else if (ev.type === 'clear') {
      noteGear('打通了 ' + (ev.name || ''));
      beep(523, 0.16, 'triangle', 0.16);
    } else if (ev.type === 'level' && ev.id === this.id) {
      noteGear('升到 Lv' + ev.level);
    } else if (ev.type === 'kill' || ev.type === 'smack') {
      boom(ev.x, ev.y, '#fff', 12);
    } else if (ev.type === 'loot' && ev.id === this.id) {
      beep(720, 0.08, 'triangle', 0.1);
    } else if (ev.type === 'pick') {
      boom(ev.x, ev.y, '#ffd54a', 14);
      if (ev.id === this.id) beep(600 + Math.random() * 400, 0.1, 'triangle', 0.12);
    } else if (ev.type === 'round' || ev.type === 'shop') {
      beep(330, 0.15, 'triangle', 0.16);
      setTimeout(() => beep(495, 0.2, 'triangle', 0.16), 120);
      if (p) boom(p.x, p.y, '#6cf', 24);
      shake = unit() * 0.008;
    } else if (ev.type === 'reset' && ev.id === this.id && p) {
      p.x = ev.x;
      p.y = ev.y;
      vx = 0;
      vy = 0;
      rec = [];
      noteGear('回到本轮起点');
    } else if (ev.type === 'deny' && ev.id === this.id) {
      noteGear(ev.text || (Rules.REASON[ev.reason] || ''));
    } else if (ev.type === 'block' && ev.id === this.id) {
      beep(880, 0.08, 'square', 0.08);
      boom(ev.x, ev.y, '#7ad7ff', 16);
    } else if (ev.type === 'hurt' && ev.id === this.id) {
      beep(180, 0.12, 'square', 0.12);
      boom(ev.x, ev.y, '#ff8a80', 18);
      shake = unit() * 0.012;
    }
  }
};

NET.applySnap = function (msg) {
  const nextMatch = msg.epoch !== this.epoch;
  const nextRound = (msg.events || []).some((ev) => ev.type === 'round');
  if (nextMatch) {
    this.epoch = msg.epoch;
    this.clearRoundDeaths();
    ghosts = [];
    rec = [];
    echoHoles = [];
    const arrived = (msg.players || []).find(pl => pl.id === msg.you);
    if (arrived && p) {
      p.x = arrived.x;
      p.y = arrived.y;
      vx = arrived.vx || 0;
      vy = arrived.vy || 0;
    }
  }
  this.id = msg.you;
  this.snap = msg;
  this.grace = !!msg.grace;
  this.graceUntil = msg.grace_until_tick || 0;
  this.step = msg.step || 0;
  this.state = msg.state;
  this.active = true;
  this.connecting = false;
  if (msg.events) this.applyEvents(msg.events);
  this.lockArena();
  this.beforeDraw();
  if (nextMatch || nextRound) {
    clearHeldInput();
    const mine = this.myPlayer();
    if (mine && mine.mode !== 'spectate') placeAtSeat(mine.slot);
    this.send({ type: 'input', ax: 0, ay: 0, mouse: null, keyboard: false, round: msg.round || round });
  }
  this.updateChrome();
};

NET.beforeDraw = function () {
  const s = this.snap;
  if (!s) return;
  this.grace = !!s.grace;
  this.graceUntil = s.grace_until_tick || 0;
  this.step = s.step || 0;
  this.state = s.state;
  t = s.t || 0;
  round = s.round || 1;
  banner = s.banner || 0;
  stars = (s.stars || []).map(q => ({ x: q.x, y: q.y }));
  ghosts = (s.ghosts || []).map(g => g.pts || []);
  this.ghostMeta = (s.ghosts || []).map(g => ({ name: g.name, color: g.color, ownerId: g.ownerId, role: g.role || 'echo' }));
  const mine = this.myPlayer();
  this.color = mine && mine.color;
  score = mine ? mine.score : 0;
  if (mine) {
    const next = Rules.emptyGear();
    next.t = s.coins || 0;
    if (s.mode === 'campaign') next.level = s.level || 1;
    (mine.gear || []).forEach(g => { next.equipped[g.slot] = viewAsItem(g); });
    (s.bag || []).forEach(g => {
      if (g.kind === 'card') next.bag.push({ kind: 'card', id: g.id, count: g.count });
      else next.bag.push(viewAsItem(g));
    });
    gear = next;
    hp = mine.hp || 0;
    maxHp = mine.maxHp || 1;
    shield = mine.shield || 0;
    if (mine.role) roleId = mine.role;
  }
  if (s.state === 'play') state = 'play';
  else if (s.state === 'shop') state = 'shop';
  else if (s.state === 'over') state = 'over';
  else if (s.state === 'clear') state = 'clear';
  else state = 'menu';
  campaignOn = s.mode === 'campaign';
  stageId = s.stageId || stageId;
  stageLabel = s.stageName || '';
  walls = s.walls || [];
  monsters = s.monsters || [];
  shots = s.shots || [];
  drops = s.drops || [];
  echoHoles = (s.ghosts || []).map(g => {
    const holes = {};
    (g.eaten || []).forEach(index => { holes[index] = 1; });
    return holes;
  });
  this.level = s.level || 1;
  this.xp = s.xp || 0;
  this.xpNext = s.xpNext || 0;
  this.unlocked = s.unlocked || 1;
  this.quests = s.quests || [];
  this.title = s.title || '';
  this.stageName = s.stageName || '';
  this.coins = s.coins || 0;
  this.bag = s.bag || [];
  this.offers = s.offers || [];
  this.shopLeft = s.shopLeft || 0;
  if (mine && mine.mode === 'play') {
    rec = this.trailOf(mine.id).map(q => ({ x: q.x, y: q.y }));
    p = { x: mine.x, y: mine.y };
    vx = mine.vx || 0;
    vy = mine.vy || 0;
  } else if (mine && mine.mode === 'dead') {
    rec = [];
    p = { x: mine.x, y: mine.y };
    vx = 0;
    vy = 0;
  } else if (mine && mine.mode === 'lobby') {
    rec = [];
    ghosts = [];
    stars = [];
    p = { x: mine.x, y: mine.y };
    vx = mine.vx || 0;
    vy = mine.vy || 0;
  } else {
    rec = [];
    p = null;
  }
  if (s.state === 'over' && !this.savedBest) {
    this.savedBest = true;
    if (score > best) {
      best = score;
      try { localStorage.echoBest = String(best); } catch (e) {}
    }
  }
  if (s.state !== 'over') this.savedBest = false;
};

NET.reconcile = function () {
  const mine = this.myPlayer();
  if (!mine || !p || (mine.mode !== 'play' && mine.mode !== 'lobby')) return;
  p.x = mine.x;
  p.y = mine.y;
  vx = mine.vx || 0;
  vy = mine.vy || 0;
};

NET.drawMark = function (q) {
  const rad = bodyR() + unit() * 0.028 + Math.sin(roundProgress() / 3) * 1.5;
  x.strokeStyle = '#ffe082';
  x.lineWidth = 2;
  x.beginPath();
  x.arc(q.x, q.y, rad, 0, Math.PI * 2);
  x.moveTo(q.x - rad - 4, q.y);
  x.lineTo(q.x + rad + 4, q.y);
  x.moveTo(q.x, q.y - rad - 4);
  x.lineTo(q.x, q.y + rad + 4);
  x.stroke();
};

NET.drawActors = function () {
  if (!this.snap) return;
  if (state === 'shop') return;
  const players = this.snap.players || [];
  for (let i = 0; i < players.length; i++) {
    const pl = players[i];
    if (pl.mode !== 'play' || pl.id === this.id) continue;
    const pts = this.trailOf(pl.id);
    if (pts.length > 1) strokeRange(x, pts, 0, pts.length - 1, this.fade(pl.color, 0.78), 2.6);
  }
  for (let i = 0; i < players.length; i++) {
    const pl = players[i];
    if (pl.mode === 'spectate') continue;
    let px = pl.x;
    let py = pl.y;
    if (pl.id === this.id && p && (pl.mode === 'play' || pl.mode === 'lobby')) { px = p.x; py = p.y; }
    const role = Rules.roleById(pl.role || 'echo');
    const shown = placeInShop(px, py, role);
    px = shown.x;
    py = shown.y;
    const sheeted = !!(role && role.sheet);
    if (!(pl.id === this.id && pl.mode === 'play')) {
      const moving = Math.hypot(pl.vx, pl.vy) > 8;
      const painted = drawSprite(x, px, py, pl.role || 'echo', faceRow(pl.id, pl.vx, pl.vy), moving, pl.mode === 'dead' ? 0.45 : 1, 1);
      if (!painted) {
        x.save();
        x.globalAlpha = pl.mode === 'dead' ? 0.45 : 1;
        x.fillStyle = pl.color;
        x.beginPath();
        x.arc(px, py, bodyR(), 0, Math.PI * 2);
        x.fill();
        x.restore();
      }
    }
    x.save();
    x.globalAlpha = 1;
    x.fillStyle = '#fff';
    x.font = '12px ui-sans-serif,system-ui,sans-serif';
    x.textAlign = 'center';
    const nameY = sheeted ? py - Rules.SPRITE.footY - 4 : py - bodyR() - 6;
    x.fillText(pl.name, px, nameY);
    x.restore();
    drawBadges(px, py, pl.gear || [], sheeted ? py - Rules.SPRITE.footY - 16 : null);
    drawPips(px, py, pl.hp, pl.maxHp, pl.shield);
  }
  const meta = this.ghostMeta || [];
  for (let i = 0; i < ghosts.length && i < meta.length; i++) {
    if (!meta[i] || !meta[i].name) continue;
    const n = Math.min(Math.max(t, 0), ghosts[i].length - 1);
    if (echoHoles[i] && echoHoles[i][n]) continue;
    const head = echoHead(ghosts[i]);
    if (!head) continue;
    const named = placeInShop(head.x, head.y, Rules.roleById(meta[i].role || 'echo'));
    x.save();
    x.globalAlpha = 0.5;
    x.fillStyle = ghostColor(i);
    x.font = '10px ui-sans-serif,system-ui,sans-serif';
    x.textAlign = 'center';
    x.fillText(meta[i].name, named.x, named.y + 20);
    x.restore();
  }
  if (state === 'play' && roundProgress() >= STEPS - warnLead()) {
    for (let i = 0; i < players.length; i++) {
      const pl = players[i];
      if (pl.id === this.id || pl.mode !== 'play') continue;
      const pts = this.trailOf(pl.id);
      if (pts[0]) this.drawMark(pts[0]);
    }
  }
};

NET.updateChrome = function () {
  const dock = document.getElementById('dock');
  const btn = document.getElementById('multi');
  const leave = document.getElementById('leave');
  if (!btn) return;
  const n = this.snap && this.snap.players ? this.snap.players.length : 0;
  if (dock) dock.hidden = this.active && (this.state === 'play' || this.state === 'shop');
  if (!this.active && !this.connecting) {
    btn.textContent = '多人同场';
    if (leave) leave.hidden = true;
    syncMenuButtons();
    return;
  }
  if (this.connecting && !this.active) {
    btn.textContent = '连接中…';
    if (leave) leave.hidden = true;
    syncMenuButtons();
    return;
  }
  btn.hidden = false;
  if (leave) leave.hidden = false;
  btn.textContent = this.state === 'over' ? '再来一局' : ('开始对局（' + n + ' 人）');
  this.syncHint();
  syncMenuButtons();
};

NET.syncHint = function () {
  if (!this.active || this.connecting) return;
  if (state === 'menu') this.note('同一块 960×540 · 空格或按钮开始');
  else if (state === 'play' || state === 'shop' || state === 'over' || state === 'clear') this.note('');
};

NET.offlineNote = function () {
  const host = location.host || '127.0.0.1:8787';
  return '连不上服务器。在仓库运行 npm install && npm start，再打开 http://' + host + '/';
};

NET.requestStart = function () {
  if (!this.active || this.state === 'play') return;
  const now = Date.now();
  if (this._startAt && now - this._startAt < 300) return;
  this._startAt = now;
  this.send({ type: 'start' });
};

NET.leave = function () {
  this.intentionalClose = true;
  if (this.ws) this.ws.close();
  this.ws = null;
  this.active = false;
  this.connecting = false;
  this.snap = null;
  this.grace = false;
  this.clearRoundDeaths();
  state = 'menu';
  campaignOn = false;
  board = '';
  monsters = [];
  shots = [];
  drops = [];
  walls = [];
  echoHoles = [];
  ghosts = [];
  rec = [];
  stars = [];
  p = null;
  this.note('');
  this.updateChrome();
};

NET.connect = function () {
  if (this.ws && (this.ws.readyState === 0 || this.ws.readyState === 1)) return;
  if (location.protocol === 'file:') {
    this.note('多人需要先运行 npm install && npm start，再打开 http://127.0.0.1:8787/');
    return;
  }
  const params = new URLSearchParams(location.search);
  const room = (params.get('room') || 'hall').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 24) || 'hall';
  const name = params.get('name') || '';
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  let ws;
  this.intentionalClose = false;
  try { ws = new WebSocket(proto + location.host + '/ws?room=' + encodeURIComponent(room)); }
  catch (e) {
    this.note(this.offlineNote());
    return;
  }
  this.ws = ws;
  this.connecting = true;
  this.note('正在连接…');
  this.updateChrome();
  const self = this;
  ws.onopen = function () { self.send({ type: 'hello', name, role: roleId }); };
  ws.onmessage = function (ev) {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg && msg.type === 'snap') self.applySnap(msg);
  };
  ws.onclose = function () {
    const was = self.active;
    const intentional = self.intentionalClose;
    self.intentionalClose = false;
    self.ws = null;
    self.active = false;
    self.connecting = false;
    self.grace = false;
    if (intentional) {
      state = 'menu';
      self.note('');
      self.updateChrome();
      return;
    }
    if (was) {
      state = 'menu';
      self.note('和服务器断开了。可以直接空格单人重开。');
    } else self.note(self.offlineNote());
    self.updateChrome();
  };
};

const soloStep = step;
step = function () {
  if (!NET.active) return soloStep();
  parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.vx *= 0.96; q.vy *= 0.96; q.l--; });
  parts = parts.filter(q => q.l > 0);
  if (shake > 0) shake *= 0.86;
  const input = NET.readInput();
  const mine = NET.myPlayer();
  if (mine && (mine.mode === 'play' || mine.mode === 'lobby')) {
    if (!p) p = { x: mine.x, y: mine.y };
    if (NET.state === 'shop') {
      vx = 0;
      vy = 0;
    } else movePlayer();
  }
  NET.send(input);
  NET.reconcile();
};

const soloDrawWorld = drawWorld;
drawWorld = function () {
  soloDrawWorld();
  if (NET.active) NET.drawActors();
};

const soloDraw = draw;
draw = function () {
  if (NET.active) NET.beforeDraw();
  soloDraw();
  if (NET.active) NET.syncHint();
};

const soloReset = reset;
reset = function () {
  if (NET.active || NET.connecting) {
    if (!NET.active) return;
    if (NET.snap && NET.snap.mode === 'campaign' && NET.state === 'over') {
      NET.send({ type: 'campaign', stage: NET.snap.stageId || 1 });
      return;
    }
    if (NET.snap && NET.snap.mode === 'campaign' && NET.state === 'clear') {
      board = 'stages';
      return;
    }
    NET.requestStart();
    return;
  }
  if (campaignOn && state === 'over') { startCampaign(stageId); return; }
  if (campaignOn && state === 'clear') { board = 'stages'; return; }
  soloReset();
};

const soloChoose = chooseArena;
chooseArena = function () {
  if (NET.active) { LW = CAP_W; LH = CAP_H; return; }
  soloChoose();
};

document.getElementById('campaign').addEventListener('click', function (e) {
  e.stopPropagation();
  e.preventDefault();
  this.blur();
  if (state === 'play' || state === 'shop') return;
  board = board === 'stages' ? '' : 'stages';
});
document.getElementById('quests').addEventListener('click', function (e) {
  e.stopPropagation();
  e.preventDefault();
  this.blur();
  if (state === 'shop') return;
  board = board === 'quests' ? '' : 'quests';
});
document.getElementById('multi').addEventListener('click', function (e) {
  e.stopPropagation();
  e.preventDefault();
  this.blur();
  if (!NET.active && !NET.connecting) NET.connect();
  else NET.requestStart();
});
document.getElementById('leave').addEventListener('click', function (e) {
  e.stopPropagation();
  e.preventDefault();
  NET.leave();
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm' && !e.repeat && !NET.active && !NET.connecting && state !== 'play') NET.connect();
  if (NET.active && !e.repeat) NET.send(NET.readInput());
});
addEventListener('keyup', () => {
  if (NET.active) NET.send(NET.readInput());
});

window.__echoNet = function () {
  return {
    active: NET.active,
    state: NET.state,
    grace: NET.grace,
    step: NET.step,
    t,
    round,
    death: NET.deathText || '',
    players: NET.snap ? NET.snap.players : [],
    ghosts: NET.snap ? NET.snap.ghosts : [],
    stars: NET.snap ? NET.snap.stars : [],
  };
};

requestAnimationFrame(frame);
</script>
